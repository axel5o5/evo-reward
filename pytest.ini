[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Strict markers catch typos in @pytest.mark.<name>.
markers =
    slow: tests that take more than ~10s (e.g. full PPO-update JIT compile)
    jax: tests that exercise the JAX-native pipeline (jax_* modules)
    integration: end-to-end tests that wire multiple modules together

# Default options: verbose output, stop on first failure, short tracebacks.
# Coverage is opt-in via `pytest --cov=src` locally and in CI — it's not
# enabled by default here so iterating on a single test stays fast.
addopts =
    -ra
    --strict-markers
    --tb=short

# pytest-xdist: run in parallel locally with `pytest -n auto`.
# CI does not set -n auto because JAX's JIT cache is per-process.

filterwarnings =
    ignore::DeprecationWarning:jax.*
    ignore::DeprecationWarning:flax.*
