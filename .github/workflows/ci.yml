name: CI

on:
  push:
    branches: [main, "dev/**"]
  pull_request:
    branches: [main]

# Pull requests may contain untrusted code. Tests need only repository reads.
permissions:
  contents: read

jobs:
  test:
    name: pytest on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86 Linux — the standard CI target
          - os: ubuntu-latest
            experimental: false
          # Apple Silicon — covers the Mac local-setup path
          - os: macos-latest
            experimental: true
          # ARM Linux — stands in for Raspberry Pi (public preview runner)
          - os: ubuntu-24.04-arm
            experimental: true

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python 3.10
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"

      - name: Install Rust (needed for phyjax2d on some platforms)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-16

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip==25.2
          python -m pip install -r requirements-ci.txt

      - name: Run fast test suite
        # `python -m` keeps the checked-out repository on sys.path. The console-script
        # entry point dropped it on hosted runners, so every historical run failed to
        # import the repository's top-level `src` package before collecting tests.
        run: python -m pytest -x -q -m "not slow" --cov=src --cov-report=term-missing --cov-report=xml
        timeout-minutes: 15

      - name: Run slow test suite (main only)
        if: github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest'
        run: python -m pytest -q -m "slow" --cov=src --cov-append --cov-report=term-missing --cov-report=xml
        timeout-minutes: 20

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage.xml
          if-no-files-found: ignore

  gate:
    name: CI gate
    if: always()
    needs: test
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require the supported test target
        env:
          MATRIX_RESULT: ${{ needs.test.result }}
        run: |
          if [ "$MATRIX_RESULT" != "success" ]; then
            echo "Required test target failed: $MATRIX_RESULT"
            exit 1
          fi
