name: CI

on:
  push:
    branches: [main, "dev/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86 Linux — the standard CI target
          - os: ubuntu-latest
            experimental: false
          # Apple Silicon — covers the Mac local-setup path
          - os: macos-latest
            experimental: false
          # ARM Linux — stands in for Raspberry Pi (public preview runner)
          - os: ubuntu-24.04-arm
            experimental: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Rust (needed for phyjax2d on some platforms)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U "jax[cpu]"
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run fast test suite
        run: pytest -x -q -m "not slow" --cov=src --cov-report=term-missing --cov-report=xml
        timeout-minutes: 15

      - name: Run slow test suite (main only)
        if: github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest'
        run: pytest -q -m "slow" --cov=src --cov-append --cov-report=term-missing --cov-report=xml
        timeout-minutes: 20

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage.xml
          if-no-files-found: ignore
