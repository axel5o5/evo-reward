name: CI

on:
  push:
    branches: [main, "dev/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86 Linux — the standard CI target
          - os: ubuntu-latest
            experimental: false
          # Apple Silicon — covers the Mac local-setup path
          - os: macos-latest
            experimental: false
          # ARM Linux — stands in for Raspberry Pi (public preview runner)
          - os: ubuntu-24.04-arm
            experimental: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Rust (needed for phyjax2d on some platforms)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U "jax[cpu]"
          pip install -r requirements.txt

      - name: Run test suite
        run: pytest -x -q
        timeout-minutes: 10
