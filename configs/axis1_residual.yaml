# Axis 1 v4: Residual reward genome (the converged design)
# =========================================================
# The reward function is the K&D linear baseline plus a small zero-init MLP
# perturbation. The MLP is single-hidden-layer, hidden=4, ~25 params total.
#
#   r(stimuli) = sum(coefs * linear_weights * stimuli)  +  MLP_residual(stimuli)
#                ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^   ^^^^^^^^^^^^^^^^^^^
#                K&D linear (proven-stable, evolves normally)   zero-init, evolves freely
#
# Why this design: prior axis-1 attempts used a randomly-initialized 121-param
# MLP that REPLACED the linear reward. That setup produced essentially random
# rewards at t=0, which meant predator behavior was random until evolution
# found something useful — but predators starved before evolution converged.
# Both v1 (mut=0.01, too clonal) and v2 (mut=0.08, too noisy) extincted
# around step 300-380K.
#
# The residual design sidesteps this: at t=0 the residual MLP outputs zero,
# so the reward is exactly K&D linear, which the same-substrate baseline runs
# show survives 1M+ with fear evolution. Mutations grow the residual gradually
# if and only if it improves fitness. No bootstrap failure mode.
#
# Two interpretations of the result:
#   - Residual stays near zero across 1M steps → "linear is sufficient,
#     MLP capacity isn't useful here."
#   - Residual weights grow → "evolution found nonlinear reward structure
#     that improves fitness." Positive result for axis 1.
# Either is publishable and easy to interpret.
#
# Inherits the proven scaffolds from baseline_med_ddb_ddm (1.35M-step run):
#   - Middle-scale geometry (800² world, caps 300/30, prey_initial 100, pred 7)
#   - DDB + DDM stability scaffolds (squared-saturation curves)
# Plus the strengthened scaffolds from the post-1.35M analysis:
#   - Tighter thresholds (pred T=4, prey T=40) so the curve fades faster
#     into the healthy regime — N=4 pred = 50% factor, N=8 pred = 80%.
#   - floor=0.0: at deep bottlenecks (N=1) cost approaches zero.
#   - ddb_max_boost=50: kappa_b is scaled UP at low pop (inverse factor),
#     so a lone survivor breeds every ~20 steps, not every ~1000. This is
#     the more biologically defensible scaffold (low-density populations
#     have higher per-capita reproductive output) — pairs naturally with
#     the threshold lowering. Together they make extinction at N≤3
#     effectively impossible.
#
# The only diff vs baseline_med_ddb_ddm is reward_type and the residual
# mutation params.
#
# See findings.md §15.

# ─── Identity ────────────────────────────────────────────────────────────────
experiment_name:    "axis1_residual"
policy_mode:        "independent"
lifecycle_mode:     "continuous"
reward_type:        "linear_plus_mlp_residual"   # NEW: linear + zero-init MLP perturbation
policy_type:        "mlp"
coevolution_mode:   "concurrent"

# ─── Stability mechanism ─────────────────────────────────────────────────────
# DDB+DDM with energy-weighted rate boost (v8 — see findings.md §15.15).
# v7 dropped DDM and went extinct at step 88K because predators crashed
# faster than energy-weighted breeding could rescue them — when ALL
# predators are simultaneously low-energy during an LV crash, "concentrate
# breeding on high-energy individuals" has nothing to concentrate on. DDM
# is needed to keep the *population* alive long enough for energy-weighted
# DDB to do its work on the breeding side.
#
# Two scaffolds working in different dimensions:
#   - DDM (uniform): keeps low-energy predators ALIVE longer
#   - DDB (energy-weighted): keeps low-energy predators FROM REPRODUCING
# Bad hunters survive but don't propagate their genes. Net: population
# stable, selection sharp.
#
# Thresholds: T=10 (pred), T=100 (prey). See findings.md §15.13.
stability_mechanism:             "ddb_ddm"
ddb_prey_threshold:              100.0
ddb_pred_threshold:              10.0
ddb_floor:                       0.0
ddb_max_boost:                   50.0
ddb_boost_distribution_alpha:    0.5    # see findings.md §15.16
                                        # 0.0=uniform, 0.5=linear (current),
                                        # 1.0=winner-take-all
ddm_pred_threshold:              10.0
ddm_floor:                       0.0

# ─── Observation ─────────────────────────────────────────────────────────────
obs_dim:            205

# ─── World (med-large scale) ─────────────────────────────────────────────────
# Halfway between middle (800) and paper (960). Bigger pred_cap (40 vs 30)
# carries ~33% more genomes through LV crash, structurally improving
# diversity preservation independent of scaffold timing. See §15.12.
world_size:         880
total_steps:        10_240_000

# ─── Population (med-large scale) ────────────────────────────────────────────
prey_initial:       125
predator_initial:   9
prey_cap:           375
predator_cap:       40
prey_e_initial:     100.0
predator_e_initial: 100.0

# ─── Agent Bodies ─────────────────────────────────────────────────────────────
prey_radius:        10.0
predator_radius:    14.0
max_motor_norm:     114.0

# ─── Sensors ─────────────────────────────────────────────────────────────────
n_proximity_sensors:    32
n_proximity_channels:   4
proximity_fov_deg:      120.0
proximity_max_range:    120.0   # paper Appendix A; emevo TOML uses 200 but paper text takes precedence (D27)
n_tactile_sensors:      18
n_tactile_channels:     4
tactile_spacing_deg:    20.0

# ─── Food Dynamics ───────────────────────────────────────────────────────────
food_max:               525
food_initial:           35
# Scale-relative: 0.5 food/step at the paper's 960² world; resolver scales
# by area ratio so density per unit area matches paper. At world=880 →
# effective rate 0.5 × (880/960)² ≈ 0.420.
food_growth_rate_at_960sq: 0.5
food_max_regen_per_step: 9

# ─── Energy ──────────────────────────────────────────────────────────────────
energy_capacity:        1000.0
prey_e_food:            1.0
prey_c_b:               1.0e-4
prey_c_a:               2.5e-6
predator_d_b:           4.0e-3
predator_d_a:           5.0e-5
predator_eta:           0.50

# ─── Predator Mouth ──────────────────────────────────────────────────────────
predator_mouth_tactile_bins: [0]
predator_eat_interval:       10

# ─── Hazard ──────────────────────────────────────────────────────────────────
kappa_h:            0.01
alpha_e:            0.02
beta_h:             0.2
alpha_t_prey:       4.0e-7
alpha_t_pred:       2.0e-7
beta_t_prey:        4.0e-6
beta_t_pred:        4.0e-6

# ─── Birth ───────────────────────────────────────────────────────────────────
kappa_b:            1.0e-3
beta_b:             0.4
zeta_b_prey:        15.0
zeta_b_pred:        100.0

# ─── Offspring ───────────────────────────────────────────────────────────────
energy_share_ratio: 0.4
spawn_spread:       100.0

# ─── Reward Genome (linear part) ─────────────────────────────────────────────
reward_weights_init_std:  0.1
mutation_df:              2
mutation_scale:           0.4
weight_clip:              100.0

# ─── Reward Genome (residual MLP part — NEW) ─────────────────────────────────
# Architecture: input(4) → Dense(4, tanh) → Dense(1) = 25 params
# Init: zero (network outputs 0 at t=0)
# Mutation: Student's t with df=2, scale 0.03 (small, accumulates gradually)
residual_hidden_size:     4
residual_mutation_scale:  0.03
residual_weight_clip:     5.0

# ─── Policy ──────────────────────────────────────────────────────────────────
policy_hidden_size:   64
policy_n_hidden_layers: 2

# ─── PPO ─────────────────────────────────────────────────────────────────────
gamma:              0.999
rollout_steps:      1024
minibatch_size:     256
ppo_epochs:         10
clip_epsilon:       0.2
entropy_coef:       0.001
gae_lambda:         0.95
lr:                 3.0e-4
adam_eps:           1.0e-7
vf_clip:            true
vf_coef:            0.5

# ─── Action Space ────────────────────────────────────────────────────────────
action_clip_low:    -20.0
action_clip_high:   80.0
action_mapping:     "sigmoid"

# ─── Replay recording ────────────────────────────────────────────────────────
# Tapered recording cadence (see src/save_schedule.py). Each replay is ~109 MB,
# so the taper drops a 10M-step run from ~56 GB to ~14 GB while keeping
# dense coverage of the early-evolution phase.
replay_record_interval_steps:
  - {after: 0,         interval: 20_000}
  - {after: 200_000,   interval: 50_000}
  - {after: 1_000_000, interval: 100_000}
replay_record_length_steps:   10_000
replay_quantize: true
replay_bucket: "evo-reward-replays-public"
replay_retention_policy: "milestones"
replay_retention_config:
  keep_last_n: 100
  keep_at_steps:
    [0, 20_000, 40_000, 60_000, 80_000, 100_000, 150_000, 200_000,
     300_000, 500_000, 800_000, 1_000_000, 2_000_000, 5_000_000, 10_000_000]
  tolerance: 5_000

# ─── Reproducibility ─────────────────────────────────────────────────────────
seed:               0
