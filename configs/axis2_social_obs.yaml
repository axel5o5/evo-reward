# Axis 2 v1: Social Behavioral Observation — KIN-ONLY (legacy)
# ============================================================
# Based on baseline_faithful.yaml — only the observation vector changes.
# All other parameters identical to K&D faithful replication.
#
# What this config does:
#   Adds heading + speed of the 5 nearest *conspecifics* (same-species) to
#   each agent's obs. Total social block = 5 x [heading, speed] = 10 dims.
#   New obs_dim = 205 + 10 = 215. Reward genome unchanged (linear).
#
# What this config does NOT do:
#   Does NOT give either species kinematic info about the other species.
#   Predators see other predators; prey see other prey. Cross-species
#   perception is unchanged from baseline (just proximity-sensor distances).
#
# Status (2026-04-29): paused. Findings.md §12 documents the seed-0 result —
# 1M survival via herd-not-fear that turned into trophic collapse at 1.10M
# in extension. Diagnosis is the local-optimum trap (see findings).
#
# Replaced going forward by `n_kin / n_other` design (findings §13). This
# config is preserved for reproducibility of the v1 result, not for new runs.
# For new social-obs experiments, use the n_kin/n_other-based configs
# (axis2-cross-1, axis2-both-1, etc.) once that design lands.

# ─── Identity ────────────────────────────────────────────────────────────────
experiment_name:    "axis2_social_obs"
policy_mode:        "independent"    # one policy network per agent — K&D faithful
lifecycle_mode:     "continuous"     # energy-driven birth-death — K&D faithful
reward_type:        "linear"         # 4-weight linear genome — K&D faithful
social_obs:         "position_heading_velocity"  # Axis 2: heading+speed of neighbors
policy_type:        "mlp"            # feedforward MLP — K&D faithful
coevolution_mode:   "concurrent"     # both species evolve simultaneously

# ─── World ───────────────────────────────────────────────────────────────────
world_size:         960              # 960x960 units (Appendix A)
total_steps:        10_240_000       # 1024 x 10^4 steps (Section 4)

# ─── Observation ─────────────────────────────────────────────────────────────
# Baseline: 128 + 72 + 2 + 1 + 1 + 1 = 205
# Social:   5 neighbors x 2 (heading, speed) = 10
# Total:    205 + 10 = 215
obs_dim:            215
n_social_neighbors: 5                # number of closest conspecifics to observe

# ─── Population ──────────────────────────────────────────────────────────────
prey_initial:       150              # (Section 4)
predator_initial:   10               # (Section 4)
prey_cap:           450              # (Section 3)
predator_cap:       50               # (Section 3)

prey_e_initial:     100.0
predator_e_initial: 100.0

# ─── Agent Bodies ─────────────────────────────────────────────────────────────
prey_radius:        10.0             # (Appendix A)
predator_radius:    14.0             # (Appendix A)
max_motor_norm:     114.0

# ─── Sensors ─────────────────────────────────────────────────────────────────
n_proximity_sensors:    32
n_proximity_channels:   4
proximity_fov_deg:      120.0
proximity_max_range:    200.0
n_tactile_sensors:      18
n_tactile_channels:     4
tactile_spacing_deg:    20.0

# ─── Food Dynamics ───────────────────────────────────────────────────────────
food_max:               600
food_initial:           40
food_growth_rate:       0.5
food_max_regen_per_step: 10

# ─── Energy — Prey ───────────────────────────────────────────────────────────
energy_capacity:        1000.0
prey_e_food:            1.0
prey_c_b:               1.0e-4
prey_c_a:               2.5e-6

# ─── Energy — Predator ───────────────────────────────────────────────────────
predator_d_b:           4.0e-3
predator_d_a:           5.0e-5
predator_eta:           0.50  # Tuned from paper's 0.6 — see tune_eta experiments in experiments-log.md

# ─── Predator Mouth ──────────────────────────────────────────────────────────
predator_mouth_tactile_bins: [0]   # mouth_smol substrate (single 20° bin) — see findings.md §10
predator_eat_interval:       10            # cooldown between catches


# ─── Hazard Function h(t, e) ─────────────────────────────────────────────────
kappa_h:            0.01
alpha_e:            0.02
beta_h:             0.2
alpha_t_prey:       4.0e-7
alpha_t_pred:       2.0e-7
beta_t_prey:        4.0e-6           # emevo: beta = 4e-6 (was 2e-6, D18 bug)
beta_t_pred:        4.0e-6

# ─── Birth Function b(e) ─────────────────────────────────────────────────────
kappa_b:            1.0e-3
beta_b:             0.4              # emevo: slope = 0.4 (was 0.1, D18 bug)
zeta_b_prey:        15.0             # emevo: delay = 15 (was 10, D18 bug)
zeta_b_pred:        100.0

# ─── Offspring ───────────────────────────────────────────────────────────────
energy_share_ratio: 0.4
spawn_spread:       100.0

# ─── Reward Genome ───────────────────────────────────────────────────────────
reward_weights_init_std:  0.1
mutation_df:              2
mutation_scale:           0.4
weight_clip:              100.0

# ─── Policy Network ──────────────────────────────────────────────────────────
policy_hidden_size:   64
policy_n_hidden_layers: 2

# ─── PPO Hyperparameters ─────────────────────────────────────────────────────
gamma:              0.999
rollout_steps:      1024
minibatch_size:     256
ppo_epochs:         10
clip_epsilon:       0.2
entropy_coef:       0.001
gae_lambda:         0.95
lr:                 3.0e-4
adam_eps:           1.0e-7
vf_clip:            true
vf_coef:            0.5

# ─── Action Space ────────────────────────────────────────────────────────────
action_clip_low:    -20.0
action_clip_high:   80.0
action_mapping:     "sigmoid"

# Logging cadence lives in configs/runtime/*.yaml.

# ─── Replay recording ────────────────────────────────────────────────────────
replay_record_interval_steps: 20_000
replay_record_length_steps:   10_000
replay_quantize: true
replay_bucket: "evo-reward-replays-public"
replay_retention_policy: "milestones"
replay_retention_config:
  keep_last_n: 100
  keep_at_steps:
    [0, 20_000, 40_000, 60_000, 80_000, 100_000, 150_000, 200_000,
     300_000, 500_000, 800_000, 1_000_000, 2_000_000, 5_000_000, 10_000_000]
  tolerance: 5_000

# ─── Reproducibility ─────────────────────────────────────────────────────────
seed:               0
