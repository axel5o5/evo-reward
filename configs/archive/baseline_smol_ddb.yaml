# Baseline (small-scale + DDB) — the new "honest baseline" for axis runs
# =======================================================================
# This replaces the K&D-faithful baseline as our default substrate for axis
# experiments. Two changes vs sweep_mouth_smol:
#
# 1. Small-scale: world 600 (vs 960), caps 25/200 (vs 50/450), initial 5/75
#    (vs 10/150), food_max 300 (vs 600). Per-agent food ratio preserved.
#    Faster wall-clock per step, same scientific signal at smaller scale.
#
# 2. DDB stability scaffold ON: when species count drops below threshold,
#    breeding-energy gate (zeta) scales down via squared saturation. Predator
#    threshold 5, prey threshold 30, floor 0.3. See findings.md §15.
#
# Why this isn't K&D-faithful anymore:
#   We deviated from K&D by reducing scale to iterate faster, and we added
#   DDB to prevent the bottleneck → extinction failure mode that consistently
#   kills our runs around 1M steps. The paper ran 10M steps without
#   extinction — we've never reached 10M, and DDB is a scaffold to make
#   long-run experiments tractable. Default ON; disable for K&D comparison
#   later if stability emerges naturally.
#
# Substrate is mouth_smol (predator_mouth_tactile_bins: [0]) — single 20°
# tactile bin, the paper's small-mouth condition that survives 1M with fear.
#
# See findings.md §15 for the full rationale.

# ─── Identity ────────────────────────────────────────────────────────────────
experiment_name:    "baseline_smol_ddb"
policy_mode:        "independent"
lifecycle_mode:     "continuous"
reward_type:        "linear"
policy_type:        "mlp"
coevolution_mode:   "concurrent"

# ─── Stability mechanism (NEW) ───────────────────────────────────────────────
stability_mechanism:    "ddb"     # density-dependent breeding (squared saturation)
ddb_prey_threshold:     30.0      # zeta_b_prey halves at N_prey=30
ddb_pred_threshold:     5.0       # zeta_b_pred halves at N_pred=5
ddb_floor:              0.3       # min effective factor (at N=0)

# ─── Observation ─────────────────────────────────────────────────────────────
obs_dim:            205

# ─── World (small-scale) ─────────────────────────────────────────────────────
world_size:         600           # was 960 — ~40% area, faster encounters
total_steps:        10_240_000

# ─── Population (small-scale) ────────────────────────────────────────────────
prey_initial:       75            # was 150
predator_initial:   5             # was 10
prey_cap:           200           # was 450
predator_cap:       25            # was 50
prey_e_initial:     100.0
predator_e_initial: 100.0

# ─── Agent Bodies ─────────────────────────────────────────────────────────────
prey_radius:        10.0
predator_radius:    14.0
max_motor_norm:     114.0

# ─── Sensors ─────────────────────────────────────────────────────────────────
n_proximity_sensors:    32
n_proximity_channels:   4
proximity_fov_deg:      120.0
proximity_max_range:    200.0
n_tactile_sensors:      18
n_tactile_channels:     4
tactile_spacing_deg:    20.0

# ─── Food Dynamics (small-scale) ─────────────────────────────────────────────
food_max:               300       # was 600 — preserves per-agent food ratio
food_initial:           20        # was 40
food_growth_rate:       0.5
food_max_regen_per_step: 5        # was 10 — scaled with food_max

# ─── Energy — Prey ───────────────────────────────────────────────────────────
energy_capacity:        1000.0
prey_e_food:            1.0
prey_c_b:               1.0e-4
prey_c_a:               2.5e-6

# ─── Energy — Predator ───────────────────────────────────────────────────────
predator_d_b:           4.0e-3
predator_d_a:           5.0e-5
predator_eta:           0.50

# ─── Predator Mouth ──────────────────────────────────────────────────────────
predator_mouth_tactile_bins: [0]   # mouth_smol substrate
predator_eat_interval:       10

# ─── Hazard Function h(t, e) ─────────────────────────────────────────────────
kappa_h:            0.01
alpha_e:            0.02
beta_h:             0.2
alpha_t_prey:       4.0e-7
alpha_t_pred:       2.0e-7
beta_t_prey:        4.0e-6
beta_t_pred:        4.0e-6

# ─── Birth Function b(e) ─────────────────────────────────────────────────────
kappa_b:            1.0e-3
beta_b:             0.4
zeta_b_prey:        15.0
zeta_b_pred:        100.0

# ─── Offspring ───────────────────────────────────────────────────────────────
energy_share_ratio: 0.4
spawn_spread:       100.0

# ─── Reward Genome ───────────────────────────────────────────────────────────
reward_weights_init_std:  0.1
mutation_df:              2
mutation_scale:           0.4
weight_clip:              100.0

# ─── Policy Network ──────────────────────────────────────────────────────────
policy_hidden_size:   64
policy_n_hidden_layers: 2

# ─── PPO Hyperparameters ─────────────────────────────────────────────────────
gamma:              0.999
rollout_steps:      1024
minibatch_size:     256
ppo_epochs:         10
clip_epsilon:       0.2
entropy_coef:       0.001
gae_lambda:         0.95
lr:                 3.0e-4
adam_eps:           1.0e-7
vf_clip:            true
vf_coef:            0.5

# ─── Action Space ────────────────────────────────────────────────────────────
action_clip_low:    -20.0
action_clip_high:   80.0
action_mapping:     "sigmoid"

# ─── Replay recording ────────────────────────────────────────────────────────
replay_record_interval_steps: 20_000
replay_record_length_steps:   10_000
replay_quantize: true
replay_bucket: "evo-reward-replays-public"
replay_retention_policy: "milestones"
replay_retention_config:
  keep_last_n: 100
  keep_at_steps:
    [0, 20_000, 40_000, 60_000, 80_000, 100_000, 150_000, 200_000,
     300_000, 500_000, 800_000, 1_000_000, 2_000_000, 5_000_000, 10_000_000]
  tolerance: 5_000

# ─── Reproducibility ─────────────────────────────────────────────────────────
seed:               0
