# Axis 1 + 2 (combined) — Residual reward MLP + social heading obs — full
# ===================================================================
# Combines axis1's residual MLP reward + axis2's approach-angle/speed obs
# (§15.24). Tier full: paper-faithful 960² world, caps 450/50, paper pop.
# Long wall-clock — use for paper-comparable runs only.

# ─── Identity ────────────────────────────────────────────────────────────────
experiment_name:    "axis12_residual_reward_mlp_social_heading_full"
policy_mode:        "independent"
lifecycle_mode:     "continuous"
reward_type:        "linear_plus_mlp_residual"        # from axis1
policy_type:        "mlp"
coevolution_mode:   "concurrent"

# ─── Stability mechanism (§15.22 retune; tier full) ─────────────────────────
stability_mechanism:                       "ddb_ddm"
density_breeding_threshold_pred:           17.0    # 22 → 17 in §15.27
density_breeding_threshold_prey:           170.0   # 220 → 170 in §15.27
density_metabolism_threshold_pred:         17.0    # 22 → 17 in §15.27
density_metabolism_threshold_prey:         170.0   # 220 → 170 in §15.27
density_factor_floor:                      0.0
breeding_share_alpha:                      0.75    # 0.5 → 0.75 in §15.27 (unified)

# ─── Observation ─────────────────────────────────────────────────────────────
obs_dim:                397                          # §15.24
proximity_encoding:     "distance_approach_speed"    # §15.24

# ─── World (paper) ──────────────────────────────────────────────────────────
world_size:         960
total_steps:        10_240_000

# ─── Population (paper) ─────────────────────────────────────────────────────
prey_initial:       150
predator_initial:   30        # 11 → 30 in §15.27 (cold-start parity)
prey_cap:           450
predator_cap:       50
prey_e_initial:     100.0
predator_e_initial: 150.0    # 100.0 → 150.0 in §15.27 (cold-start parity)
emergency_breeding_n_pred: 3   # NEW in §15.27 (cold-start parity)
emergency_breeding_n_prey: 10  # NEW in §15.27 (cold-start parity)

# ─── Agent Bodies ────────────────────────────────────────────────────────────
prey_radius:        10.0
predator_radius:    14.0
max_motor_norm:     114.0

# ─── Sensors ─────────────────────────────────────────────────────────────────
n_proximity_sensors:    32
n_proximity_channels:   10            # §15.24
proximity_fov_deg:      120.0
proximity_max_range:    120.0
n_tactile_sensors:      18
n_tactile_channels:     4
tactile_spacing_deg:    20.0

# ─── Physics (paper-faithful) ────────────────────────────────────────────────
n_physics_iter:     5

# ─── Food Dynamics ───────────────────────────────────────────────────────────
food_max:               600
food_initial:           40
food_growth_rate_at_960sq: 0.5
food_max_regen_per_step: 10

# ─── Energy ──────────────────────────────────────────────────────────────────
energy_capacity:        1000.0
prey_e_food:            1.0
prey_c_b:               1.0e-4
prey_c_a:               2.5e-6
predator_d_b:           4.0e-3
predator_d_a:           5.0e-5
predator_eta:           0.50

# ─── Predator Mouth — v10 widening ──────────────────────────────────────────
predator_mouth_tactile_bins: [0, 1, 17]
predator_eat_interval:       10

# ─── Hazard ──────────────────────────────────────────────────────────────────
kappa_h:            0.01
alpha_e:            0.02
beta_h:             0.2
alpha_t_prey:       4.0e-7
alpha_t_pred:       2.0e-7
beta_t_prey:        4.0e-6
beta_t_pred:        4.0e-6

# ─── Birth ───────────────────────────────────────────────────────────────────
kappa_b:            1.0e-3
beta_b:             0.4
zeta_b_prey:        15.0
zeta_b_pred:        100.0

# ─── Offspring ───────────────────────────────────────────────────────────────
energy_share_ratio: 0.4
spawn_spread:       100.0

# §15.28 — scaffold-aware additive birth-energy bonus. Both child AND parent
# get +bonus at birth, where bonus = bonus_global + bonus_emergency * (1 - factor).
# Rescues death-spiral regime where parent E is too low to give a viable child
# via the bare K&D 0.4 transfer (axis1/small extincted at step ~80K because
# newborns inherited starvation). Defaults 0.0 → paper-faithful K&D.
birth_energy_bonus_global_prey:    1.0    # always added at prey birth
birth_energy_bonus_global_pred:    5.0    # always added at predator birth
birth_energy_bonus_emergency_prey: 5.0    # added linearly as prey scaffold engages
birth_energy_bonus_emergency_pred: 50.0   # added linearly as predator scaffold engages

# ─── Reward Genome (linear + residual MLP — from axis1) ─────────────────────
reward_weights_init_std:  0.1
mutation_df:              2
mutation_scale:           0.4
weight_clip:              100.0
residual_hidden_size:     4
residual_mutation_scale:  0.03
residual_weight_clip:     5.0

# ─── Policy ──────────────────────────────────────────────────────────────────
policy_hidden_size:   64
policy_n_hidden_layers: 2

# ─── PPO ─────────────────────────────────────────────────────────────────────
gamma:              0.999
rollout_steps:      1024
minibatch_size:     256
ppo_epochs:         10
clip_epsilon:       0.2
entropy_coef:       0.001
gae_lambda:         0.95
lr:                 3.0e-4
adam_eps:           1.0e-7
vf_clip:            true
vf_coef:            0.5

# ─── Per-agent age-keyed LR schedule (v10) ──────────────────────────────────
lr_schedule_enable:       true
lr_schedule_initial:      1.0e-3
lr_schedule_final:        3.0e-4
lr_schedule_decay_steps:  30000

# ─── Death-age ring buffer (v10) ────────────────────────────────────────────
death_age_ring_size:      256

# ─── Action Space ────────────────────────────────────────────────────────────
action_clip_low:    -20.0
action_clip_high:   80.0
action_mapping:     "sigmoid"

# ─── Replay recording ────────────────────────────────────────────────────────
replay_record_interval_steps:
  - {after: 0,         interval: 20_000}
  - {after: 200_000,   interval: 50_000}
  - {after: 1_000_000, interval: 100_000}
replay_record_length_steps:   10_000
replay_quantize: true
replay_bucket: "evo-reward-replays-public"
replay_retention_policy: "milestones"
replay_retention_config:
  keep_last_n: 100
  keep_at_steps:
    [0, 20_000, 40_000, 60_000, 80_000, 100_000, 150_000, 200_000,
     300_000, 500_000, 800_000, 1_000_000, 2_000_000, 5_000_000, 10_000_000]
  tolerance: 5_000

# ─── Reproducibility ─────────────────────────────────────────────────────────
seed:               0
