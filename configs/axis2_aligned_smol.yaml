# Axis 2 v3 (small-scale): Bin-aligned heading encoding + small-scale + DDB
# =========================================================================
# Inherits the new baseline (small-scale + DDB ON). The single diff vs
# baseline_smol_ddb is the proximity sensor encoding: bin-aligned heading
# channels instead of the K&D-faithful winner-take-all.
#
# Per proximity bin, each species channel reports
# [distance, sin(rel_heading), cos(rel_heading)] of the closest agent of
# that species in that bin (8 channels per bin total: prey/pred get 3 each,
# food/wall get 1 each). No social-slot binding problem.
#
# obs_dim = 256 (proximity, 32×8) + 72 (tactile) + 5 (self) = 333.
#
# See findings.md §13 for the bin-aligned design rationale, §15 for the
# strategic-reset context.

# ─── Identity ────────────────────────────────────────────────────────────────
experiment_name:    "axis2_aligned_smol"
policy_mode:        "independent"
lifecycle_mode:     "continuous"
reward_type:        "linear"
policy_type:        "mlp"
coevolution_mode:   "concurrent"

# ─── Stability mechanism ─────────────────────────────────────────────────────
stability_mechanism:    "ddb"
ddb_prey_threshold:     30.0
ddb_pred_threshold:     5.0
ddb_floor:              0.3

# ─── Observation ─────────────────────────────────────────────────────────────
obs_dim:                333
proximity_encoding:     "distance_and_heading"   # bin-aligned, sin/cos relative

# ─── World (small-scale) ─────────────────────────────────────────────────────
world_size:         600
total_steps:        10_240_000

# ─── Population (small-scale) ────────────────────────────────────────────────
prey_initial:       75
predator_initial:   5
prey_cap:           200
predator_cap:       25
prey_e_initial:     100.0
predator_e_initial: 100.0

# ─── Agent Bodies ─────────────────────────────────────────────────────────────
prey_radius:        10.0
predator_radius:    14.0
max_motor_norm:     114.0

# ─── Sensors ─────────────────────────────────────────────────────────────────
n_proximity_sensors:    32
n_proximity_channels:   8                # 8 channels with distance_and_heading encoding
proximity_fov_deg:      120.0
proximity_max_range:    200.0
n_tactile_sensors:      18
n_tactile_channels:     4
tactile_spacing_deg:    20.0

# ─── Food Dynamics ───────────────────────────────────────────────────────────
food_max:               300
food_initial:           20
food_growth_rate:       0.5
food_max_regen_per_step: 5

# ─── Energy ──────────────────────────────────────────────────────────────────
energy_capacity:        1000.0
prey_e_food:            1.0
prey_c_b:               1.0e-4
prey_c_a:               2.5e-6
predator_d_b:           4.0e-3
predator_d_a:           5.0e-5
predator_eta:           0.50

# ─── Predator Mouth ──────────────────────────────────────────────────────────
predator_mouth_tactile_bins: [0]
predator_eat_interval:       10

# ─── Hazard ──────────────────────────────────────────────────────────────────
kappa_h:            0.01
alpha_e:            0.02
beta_h:             0.2
alpha_t_prey:       4.0e-7
alpha_t_pred:       2.0e-7
beta_t_prey:        4.0e-6
beta_t_pred:        4.0e-6

# ─── Birth ───────────────────────────────────────────────────────────────────
kappa_b:            1.0e-3
beta_b:             0.4
zeta_b_prey:        15.0
zeta_b_pred:        100.0

# ─── Offspring ───────────────────────────────────────────────────────────────
energy_share_ratio: 0.4
spawn_spread:       100.0

# ─── Reward Genome ───────────────────────────────────────────────────────────
reward_weights_init_std:  0.1
mutation_df:              2
mutation_scale:           0.4
weight_clip:              100.0

# ─── Policy ──────────────────────────────────────────────────────────────────
policy_hidden_size:   64
policy_n_hidden_layers: 2

# ─── PPO ─────────────────────────────────────────────────────────────────────
gamma:              0.999
rollout_steps:      1024
minibatch_size:     256
ppo_epochs:         10
clip_epsilon:       0.2
entropy_coef:       0.001
gae_lambda:         0.95
lr:                 3.0e-4
adam_eps:           1.0e-7
vf_clip:            true
vf_coef:            0.5

# ─── Action Space ────────────────────────────────────────────────────────────
action_clip_low:    -20.0
action_clip_high:   80.0
action_mapping:     "sigmoid"

# ─── Replay recording ────────────────────────────────────────────────────────
replay_record_interval_steps: 20_000
replay_record_length_steps:   10_000
replay_quantize: true
replay_bucket: "evo-reward-replays-public"
replay_retention_policy: "milestones"
replay_retention_config:
  keep_last_n: 100
  keep_at_steps:
    [0, 20_000, 40_000, 60_000, 80_000, 100_000, 150_000, 200_000,
     300_000, 500_000, 800_000, 1_000_000, 2_000_000, 5_000_000, 10_000_000]
  tolerance: 5_000

# ─── Reproducibility ─────────────────────────────────────────────────────────
seed:               0
