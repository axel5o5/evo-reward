# K&D Baseline Control — tier full (paper-faithful 960² scale)
# ===================================================================
# Matched scientific control for axis1/full.yaml, axis2/full.yaml,
# axis12/full.yaml. Same scaffolds, same scale, same population caps —
# only diff vs axis1/full.yaml is `reward_type: linear` (no residual MLP).
# Only diff vs axis2/full.yaml is K&D-faithful proximity encoding.
#
# Use this for paper-comparable A/B runs at the full 960² K&D scale.
# Long wall-clock (~36-48h on L4 GPU).
#
# Note this is *not* the same as `baseline_faithful.yaml`:
#   - this file:           v10 DDB+DDM scaffolds, v10 mouth, age-LR, death-age
#   - baseline_faithful:   no scaffolds, paper-pure mouth/PPO/etc.
# Use `baseline_faithful.yaml` when you want the K&D paper's exact dynamics.
# Use this file when you want the matched control for the axis runs.

# ─── Identity ────────────────────────────────────────────────────────────────
experiment_name:    "baseline_kd_linear_full"
policy_mode:        "independent"
lifecycle_mode:     "continuous"
reward_type:        "linear"
policy_type:        "mlp"
coevolution_mode:   "concurrent"

# ─── Stability mechanism (matches axis1/full §15.22 retune; tier full) ──────
stability_mechanism:                       "ddb_ddm"
density_breeding_threshold_pred:           15.0    # §15.22→§15.27→§15.28b retune (axis1 alignment)
density_breeding_threshold_prey:           150.0   # §15.22→§15.27→§15.28b retune (axis1 alignment)
density_metabolism_threshold_pred:         15.0    # §15.22→§15.27→§15.28b retune (axis1 alignment)
density_metabolism_threshold_prey:         150.0   # §15.22→§15.27→§15.28b retune (axis1 alignment)
density_factor_floor:                      0.0
breeding_share_alpha:                      0.75    # §15.27 unified at 0.75 (axis1 alignment)

# ─── Observation ─────────────────────────────────────────────────────────────
obs_dim:            205

# ─── World (paper) ──────────────────────────────────────────────────────────
world_size:         960
total_steps:        10_240_000

# ─── Population (paper) ─────────────────────────────────────────────────────
prey_initial:       150
predator_initial:   30        # §15.26 cold-start parity (axis1 alignment)
prey_cap:           450        # §15.27 paper-density (axis1 alignment)
predator_cap:       50
prey_e_initial:     100.0
predator_e_initial: 150.0    # §15.26 cold-start parity (axis1 alignment)
emergency_breeding_n_pred: 3   # §15.26 (axis1 alignment)
emergency_breeding_n_prey: 10  # §15.26 (axis1 alignment)

# ─── Agent Bodies ────────────────────────────────────────────────────────────
prey_radius:        10.0
predator_radius:    14.0
max_motor_norm:     114.0

# ─── Sensors ─────────────────────────────────────────────────────────────────
n_proximity_sensors:    32
n_proximity_channels:   4
proximity_fov_deg:      120.0
proximity_max_range:    120.0
n_tactile_sensors:      18
n_tactile_channels:     4
tactile_spacing_deg:    20.0

# ─── Physics (paper-faithful) ───────────────────────────────────────────────
n_physics_iter:     5

# ─── Food Dynamics ───────────────────────────────────────────────────────────
food_max:               600        # §15.32 tier-graduated: paper-density × 1.00
food_radius:           4.0    # §15.30 paper-faithful (was implicit 0)
food_initial:           40
food_growth_rate_at_960sq: 0.5
food_max_regen_per_step: 10         # §15.32 tier-graduated × 1.00

# ─── Energy ──────────────────────────────────────────────────────────────────
energy_capacity:        1000.0
prey_e_food:            1.0
prey_c_b:               1.0e-4
prey_c_a:               2.5e-6
predator_d_b:           4.5e-3       # §15.31: 4e-3 → 4.5e-3 (+12.5% passive — anti-lazy)
predator_d_a:           4.0e-5       # §15.31: 5e-5 → 4e-5 (-20% active — anti-lazy)
predator_eta:           0.5       # §15.32 tier-graduated: paper 0.5 (full) / 0.575 (med) / 0.65 (small) / 0.70 (tiny)

# ─── Predator Mouth — v10 widening ──────────────────────────────────────────
prey_mouth_tactile_bins:     [0, 17]    # §15.30 paper-faithful
predator_mouth_tactile_bins: [0, 1, 17]
predator_eat_interval:       10

# ─── Hazard ──────────────────────────────────────────────────────────────────
kappa_h:            0.01
alpha_e:            0.02
beta_h:             0.2
alpha_t_prey:       4.0e-7
alpha_t_pred:       2.0e-7
beta_t_prey:        4.0e-6
beta_t_pred:        4.0e-6

# ─── Birth ───────────────────────────────────────────────────────────────────
kappa_b:            1.0e-3
beta_b:             0.4
zeta_b_prey:        15.0
zeta_b_pred:        100.0

# ─── Offspring ───────────────────────────────────────────────────────────────
energy_share_ratio: 0.4
spawn_spread:       100.0
birth_energy_bonus_global_prey:    1.0    # §15.28 (axis1 alignment)
birth_energy_bonus_global_pred:    5.0    # §15.28 (axis1 alignment)
birth_energy_bonus_emergency_prey: 5.0    # §15.28 (axis1 alignment)
birth_energy_bonus_emergency_pred: 50.0   # §15.28 (axis1 alignment)

# ─── Reward Genome (linear only) ─────────────────────────────────────────────
reward_weights_init_std:  0.1
mutation_df:              2
mutation_scale:           0.4
weight_clip:              100.0

# ─── Policy ──────────────────────────────────────────────────────────────────
policy_hidden_size:   64
policy_n_hidden_layers: 2

# ─── PPO ─────────────────────────────────────────────────────────────────────
gamma:              0.999
rollout_steps:      1024
minibatch_size:     256
ppo_epochs:         10
clip_epsilon:       0.2
entropy_coef:       0.001
gae_lambda:         0.95
lr:                 3.0e-4
adam_eps:           1.0e-7
vf_clip:            true
vf_coef:            0.5

# ─── Per-agent age-keyed LR schedule (v10) ──────────────────────────────────
lr_schedule_enable:       true
lr_schedule_initial:      1.0e-3
lr_schedule_final:        3.0e-4
lr_schedule_decay_steps:  30000

# ─── Death-age ring buffer (v10) ────────────────────────────────────────────
death_age_ring_size:      256

# ─── Action Space ────────────────────────────────────────────────────────────
action_clip_low:    -20.0
action_clip_high:   80.0
action_mapping:     "sigmoid"

# ─── Replay recording ────────────────────────────────────────────────────────
replay_record_interval_steps:
  - {after: 0,         interval: 20_000}
  - {after: 200_000,   interval: 50_000}
  - {after: 1_000_000, interval: 100_000}
replay_record_length_steps:   10_000
replay_quantize: true
replay_bucket: "evo-reward-replays-public"
replay_retention_policy: "milestones"
replay_retention_config:
  keep_last_n: 100
  keep_at_steps:
    [0, 20_000, 40_000, 60_000, 80_000, 100_000, 150_000, 200_000,
     300_000, 500_000, 800_000, 1_000_000, 2_000_000, 5_000_000, 10_000_000]
  tolerance: 5_000

# ─── Reproducibility ─────────────────────────────────────────────────────────
seed:               0
