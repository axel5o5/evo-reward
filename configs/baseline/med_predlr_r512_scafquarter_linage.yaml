# K&D Baseline (post-§15.32b) + Predator LR 3× + 2× PPO + Quarter Scaffold + Small Linear Age — tier med
# =====================================================================================================
# Forks med_predlr7_r512_scafhalf_linage.yaml with two changes:
#   1. lr_pred_multiplier 7.0 → 3.0 (back down to the conservative 3×).
#      Effective predator LR at age 0: 3 × 1e-3 = 3e-3, well clear of the
#      blow-up regime.
#   2. Scaffold thresholds quartered relative to the post-§15.28b baseline:
#        density_breeding_threshold_pred:  13.0 → 3.25
#        density_breeding_threshold_prey: 130.0 → 32.5
#        density_metabolism_threshold_pred: 13.0 → 3.25
#        density_metabolism_threshold_prey: 130.0 → 32.5
#      (Half the values from med_predlr_r256_scafhalf.yaml's already-halved
#      thresholds.) At T=3.25 for predators, the scaffold only engages when
#      pred population is below ~3 — i.e., near extinction. In normal
#      operation the scaffold should be effectively dormant.
#
# Everything else inherited from the prior run:
#   - rollout_steps=512 (PPO triggers 2× original baseline rate)
#   - Predator age hazard linear (beta_t_pred=8e-13)
#   - All §15.30/§15.31/§15.32/§15.32b energetics from baseline/med.yaml
#
# Hypothesis: with the LR boost dialed back to a sane level and the scaffold
# nearly out of the picture, predator survival now depends almost entirely
# on the policy / energetics dynamics. If they make it to mid-population,
# the answer is "they can survive without a scaffold." If they crash, the
# scaffold was load-bearing.

# ─── Identity ────────────────────────────────────────────────────────────────
experiment_name:    "baseline_kd_predlr_r512_scafquarter_linage_med"
policy_mode:        "independent"
lifecycle_mode:     "continuous"
reward_type:        "linear"
policy_type:        "mlp"
coevolution_mode:   "concurrent"

# ─── Stability mechanism (QUARTERED thresholds — was 13.0 / 130.0 originally) ─
stability_mechanism:                       "ddb_ddm"
density_breeding_threshold_pred:           3.25     # 1/4 of post-§15.28b baseline (13.0)
density_breeding_threshold_prey:           32.5     # 1/4 of post-§15.28b baseline (130.0)
density_metabolism_threshold_pred:         3.25
density_metabolism_threshold_prey:         32.5
density_factor_floor:                      0.0
breeding_share_alpha:                      0.75

# ─── Observation ─────────────────────────────────────────────────────────────
obs_dim:            205

# ─── World (med-large scale) ─────────────────────────────────────────────────
world_size:         880
total_steps:        10_240_000

# ─── Population (med-large scale) ────────────────────────────────────────────
prey_initial:       125
predator_initial:   20
prey_cap:           375
predator_cap:       40
prey_e_initial:     100.0
predator_e_initial: 150.0
emergency_breeding_n_pred: 3
emergency_breeding_n_prey: 10

# ─── Agent Bodies ────────────────────────────────────────────────────────────
prey_radius:        10.0
predator_radius:    14.0
max_motor_norm:     114.0

# ─── Sensors ─────────────────────────────────────────────────────────────────
n_proximity_sensors:    32
n_proximity_channels:   4
proximity_fov_deg:      120.0
proximity_max_range:    120.0
n_tactile_sensors:      18
n_tactile_channels:     4
tactile_spacing_deg:    20.0

# ─── Physics (paper-faithful) ───────────────────────────────────────────────
n_physics_iter:     5

# ─── Food Dynamics ───────────────────────────────────────────────────────────
food_max:               530
food_radius:            4.0
food_initial:           35
food_growth_rate_at_960sq: 0.5
food_max_regen_per_step: 8

# ─── Energy ──────────────────────────────────────────────────────────────────
energy_capacity:        1000.0
prey_e_food:            1.0
prey_c_b:               1.0e-4
prey_c_a:               2.5e-6
predator_d_b:           4.5e-3
predator_d_a:           4.0e-5
predator_eta:           0.55

# ─── Mouths ──────────────────────────────────────────────────────────────────
prey_mouth_tactile_bins:     [0, 17]
predator_mouth_tactile_bins: [0, 1, 17]
predator_eat_interval:       10

# ─── Hazard ──────────────────────────────────────────────────────────────────
# Prey: K&D paper-faithful exponential.
# Predators: linear mode with small non-zero slope.
kappa_h:            0.01
alpha_e:            0.02
beta_h:             0.2
alpha_t_prey:       4.0e-7
alpha_t_pred:       2.0e-7
beta_t_prey:        4.0e-6
beta_t_pred:        8.0e-13
age_hazard_mode_prey: "exp"
age_hazard_mode_pred: "linear"

# ─── Birth ───────────────────────────────────────────────────────────────────
kappa_b:            1.0e-3
beta_b:             0.4
zeta_b_prey:        15.0
zeta_b_pred:        100.0

# ─── Offspring ───────────────────────────────────────────────────────────────
energy_share_ratio: 0.4
spawn_spread:       100.0
birth_energy_bonus_global_prey:    1.0
birth_energy_bonus_global_pred:    5.0
birth_energy_bonus_emergency_prey: 5.0
birth_energy_bonus_emergency_pred: 50.0

# ─── Reward Genome (linear only) ─────────────────────────────────────────────
reward_weights_init_std:  0.1
mutation_df:              2
mutation_scale:           0.4
weight_clip:              100.0

# ─── Policy ──────────────────────────────────────────────────────────────────
policy_hidden_size:   64
policy_n_hidden_layers: 2

# ─── PPO ─────────────────────────────────────────────────────────────────────
gamma:              0.999
rollout_steps:      512           # 2× the original (1024) trigger rate
minibatch_size:     256
ppo_epochs:         10
clip_epsilon:       0.2
entropy_coef:       0.001
gae_lambda:         0.95
lr:                 3.0e-4
adam_eps:           1.0e-7
vf_clip:            true
vf_coef:            0.5

# ─── Per-agent age-keyed LR schedule (v10) ──────────────────────────────────
lr_schedule_enable:       true
lr_schedule_initial:      1.0e-3
lr_schedule_final:        3.0e-4
lr_schedule_decay_steps:  30000

# ─── Per-species LR multiplier ──────────────────────────────────────────────
lr_prey_multiplier:       1.0
lr_pred_multiplier:       3.0     # back down from 7×

# ─── Death-age ring buffer (v10) ────────────────────────────────────────────
death_age_ring_size:      256

# ─── Action Space ────────────────────────────────────────────────────────────
action_clip_low:    -20.0
action_clip_high:   80.0
action_mapping:     "sigmoid"

# ─── Replay recording ────────────────────────────────────────────────────────
replay_record_interval_steps:
  - {after: 0,         interval: 20_000}
  - {after: 200_000,   interval: 50_000}
  - {after: 1_000_000, interval: 100_000}
replay_record_length_steps:   10_000
replay_quantize: true
replay_bucket: "evo-reward-replays-public"
replay_retention_policy: "milestones"
replay_retention_config:
  keep_last_n: 100
  keep_at_steps:
    [0, 20_000, 40_000, 60_000, 80_000, 100_000, 150_000, 200_000,
     300_000, 500_000, 800_000, 1_000_000, 2_000_000, 5_000_000, 10_000_000]
  tolerance: 5_000

# ─── Reproducibility ─────────────────────────────────────────────────────────
seed:               0
