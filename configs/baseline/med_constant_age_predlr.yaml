# K&D Baseline + Age-Independent Hazard + Predator LR Boost — tier med
# ===================================================================
# Same as baseline/med_constant_age.yaml (linear K&D reward, no MLP,
# predator age-hazard constant at 2e-7 regardless of age) EXCEPT the
# PPO learning rate for predators is multiplied by 10×. Prey LR
# unchanged.
#
# Why: in med_constant_age.yaml the median active predator had only 1
# PPO update at step 60k (ages 685–45k, mostly under 2k). With age
# already neutralized as a hazard driver, the next-most-likely
# bottleneck for predator survival is "they just don't learn fast
# enough to catch prey before starving." Bumping their LR — both the
# initial schedule peak AND the floor — gives short-lived predators a
# chance to make meaningful policy progress in their few PPO updates.
# If predators now persist, learning speed was the bottleneck. If they
# still go extinct, it's something downstream (catch dynamics,
# energy budget, prey escape policy).
#
# Implementation: lr_pred_multiplier=10.0, applied multiplicatively on
# top of the age schedule. So at age=0, predator effective LR =
# 10 × 1e-3 = 1e-2; at age=30k+, predator effective LR = 10 × 3e-4 =
# 3e-3. Prey LR unchanged.
#
# Risk: very high LR (1e-2 on Adam) can blow up policy gradients. If
# predator policies become NaN early, lower the multiplier (5×, 3×).
# Watch for entropy collapse or Nan rewards in the first 50k steps.

# ─── Identity ────────────────────────────────────────────────────────────────
experiment_name:    "baseline_kd_constant_age_predlr_med"
policy_mode:        "independent"
lifecycle_mode:     "continuous"
reward_type:        "linear"
policy_type:        "mlp"
coevolution_mode:   "concurrent"

# ─── Stability mechanism (matches axis1/med §15.22 retune) ──────────────────
stability_mechanism:                       "ddb_ddm"
density_breeding_threshold_pred:           20.0
density_breeding_threshold_prey:           200.0
density_metabolism_threshold_pred:         20.0
density_metabolism_threshold_prey:         200.0
density_factor_floor:                      0.0
breeding_share_alpha:                      0.5

# ─── Observation ─────────────────────────────────────────────────────────────
obs_dim:            205

# ─── World (med-large scale) ─────────────────────────────────────────────────
world_size:         880
total_steps:        10_240_000

# ─── Population (med-large scale) ────────────────────────────────────────────
prey_initial:       125
predator_initial:   9
prey_cap:           375
predator_cap:       40
prey_e_initial:     100.0
predator_e_initial: 100.0

# ─── Agent Bodies ────────────────────────────────────────────────────────────
prey_radius:        10.0
predator_radius:    14.0
max_motor_norm:     114.0

# ─── Sensors ─────────────────────────────────────────────────────────────────
n_proximity_sensors:    32
n_proximity_channels:   4
proximity_fov_deg:      120.0
proximity_max_range:    120.0
n_tactile_sensors:      18
n_tactile_channels:     4
tactile_spacing_deg:    20.0

# ─── Physics (paper-faithful) ───────────────────────────────────────────────
n_physics_iter:     5

# ─── Food Dynamics ───────────────────────────────────────────────────────────
food_max:               525
food_initial:           35
food_growth_rate_at_960sq: 0.5
food_max_regen_per_step: 9

# ─── Energy ──────────────────────────────────────────────────────────────────
energy_capacity:        1000.0
prey_e_food:            1.0
prey_c_b:               1.0e-4
prey_c_a:               2.5e-6
predator_d_b:           4.0e-3
predator_d_a:           5.0e-5
predator_eta:           0.50

# ─── Predator Mouth — v10 widening ──────────────────────────────────────────
predator_mouth_tactile_bins: [0, 1, 17]
predator_eat_interval:       10

# ─── Hazard ──────────────────────────────────────────────────────────────────
# Prey: K&D paper-faithful exponential (unchanged).
# Predators: linear mode with slope=0 → age_term is the constant K&D at-birth
# value (2e-7) regardless of age. Per-step age-hazard contribution at moderate
# energy ≈ kappa_h * energy_term(100) * 2e-7 ≈ 1e-9, so age-hazard expected
# lifespan ~1e9 steps — far longer than total_steps. Effectively no age death.
kappa_h:            0.01
alpha_e:            0.02
beta_h:             0.2
alpha_t_prey:       4.0e-7
alpha_t_pred:       2.0e-7
beta_t_prey:        4.0e-6
beta_t_pred:        0.0           # NEW: zero slope → age-independent hazard
age_hazard_mode_prey: "exp"
age_hazard_mode_pred: "linear"

# ─── Birth ───────────────────────────────────────────────────────────────────
kappa_b:            1.0e-3
beta_b:             0.4
zeta_b_prey:        15.0
zeta_b_pred:        100.0

# ─── Offspring ───────────────────────────────────────────────────────────────
energy_share_ratio: 0.4
spawn_spread:       100.0

# ─── Reward Genome (linear only) ─────────────────────────────────────────────
reward_weights_init_std:  0.1
mutation_df:              2
mutation_scale:           0.4
weight_clip:              100.0

# ─── Policy ──────────────────────────────────────────────────────────────────
policy_hidden_size:   64
policy_n_hidden_layers: 2

# ─── PPO ─────────────────────────────────────────────────────────────────────
gamma:              0.999
rollout_steps:      1024
minibatch_size:     256
ppo_epochs:         10
clip_epsilon:       0.2
entropy_coef:       0.001
gae_lambda:         0.95
lr:                 3.0e-4
adam_eps:           1.0e-7
vf_clip:            true
vf_coef:            0.5

# ─── Per-agent age-keyed LR schedule (v10) ──────────────────────────────────
lr_schedule_enable:       true
lr_schedule_initial:      1.0e-3
lr_schedule_final:        3.0e-4
lr_schedule_decay_steps:  30000

# ─── Per-species LR multiplier ──────────────────────────────────────────────
# Stacks multiplicatively on top of the age schedule. Predators get 10× to
# compensate for short lifespans (few PPO updates per agent). Prey unchanged.
lr_prey_multiplier:       1.0
lr_pred_multiplier:       10.0

# ─── Death-age ring buffer (v10) ────────────────────────────────────────────
death_age_ring_size:      256

# ─── Action Space ────────────────────────────────────────────────────────────
action_clip_low:    -20.0
action_clip_high:   80.0
action_mapping:     "sigmoid"

# ─── Replay recording ────────────────────────────────────────────────────────
replay_record_interval_steps:
  - {after: 0,         interval: 20_000}
  - {after: 200_000,   interval: 50_000}
  - {after: 1_000_000, interval: 100_000}
replay_record_length_steps:   10_000
replay_quantize: true
replay_bucket: "evo-reward-replays-public"
replay_retention_policy: "milestones"
replay_retention_config:
  keep_last_n: 100
  keep_at_steps:
    [0, 20_000, 40_000, 60_000, 80_000, 100_000, 150_000, 200_000,
     300_000, 500_000, 800_000, 1_000_000, 2_000_000, 5_000_000, 10_000_000]
  tolerance: 5_000

# ─── Reproducibility ─────────────────────────────────────────────────────────
seed:               0
