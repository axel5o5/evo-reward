# K&D Baseline + Small Linear Predator Age-Hazard + Predator LR 3× + Faster PPO — tier med
# ===========================================================================================
# Variant of baseline/med_constant_age_predlr.yaml with three changes:
#   1. Predator age-hazard slope flipped from 0 → 8e-13 (small linear term),
#      matching baseline/med_linear_age.yaml's calibration: ~10–100× smaller
#      than the paper-faithful exp form across a 0..2M-step lifespan, so
#      late-life mortality grows but never runs away.
#        age=0:       2.0e-7
#        age=1_000_000: 2.0e-7 + 8e-13 * 1e6 = 1.0e-6
#        age=2_000_000: 2.0e-7 + 8e-13 * 2e6 = 1.8e-6
#   2. Predator LR multiplier dialed back from 10× → 3×. Still well above the
#      prey baseline, but conservative enough that we should not see the
#      gradient blow-ups that motivated the predlr_med "if predators NaN,
#      lower to 5× or 3×" caveat.
#   3. PPO rollout shortened 1024 → 256 (minibatch unchanged at 256). PPO now
#      triggers 4× more often per agent. This directly attacks the Methuselah
#      pipeline finding from the predlr_med run at step 6.9M: 18 active
#      predators with PPO-update count median 83 / max 646 — a few veterans
#      dominate, the median predator gets very few learning events.
#      Total Adam steps per env-step is unchanged (each trigger now does 1/4
#      the gradient work — 10 epochs × 1 minibatch = 10 Adam steps/trigger);
#      the redistribution is purely "more frequent, smaller PPO events," which
#      is the right knob given short predator lifespans.
#
# Hypothesis: with mild age-pressure, conservative LR, and 4× faster PPO
# triggers, mid-lifespan predators (10k–100k step ages) should reach a
# competent catch policy before the Methuselah crash dynamic takes over.

# ─── Identity ────────────────────────────────────────────────────────────────
experiment_name:    "baseline_kd_linear_age_predlr_med_r256"
policy_mode:        "independent"
lifecycle_mode:     "continuous"
reward_type:        "linear"
policy_type:        "mlp"
coevolution_mode:   "concurrent"

# ─── Stability mechanism (matches axis1/med §15.22 retune) ──────────────────
stability_mechanism:                       "ddb_ddm"
density_breeding_threshold_pred:           20.0
density_breeding_threshold_prey:           200.0
density_metabolism_threshold_pred:         20.0
density_metabolism_threshold_prey:         200.0
density_factor_floor:                      0.0
breeding_share_alpha:                      0.5

# ─── Observation ─────────────────────────────────────────────────────────────
obs_dim:            205

# ─── World (med-large scale) ─────────────────────────────────────────────────
world_size:         880
total_steps:        10_240_000

# ─── Population (med-large scale) ────────────────────────────────────────────
prey_initial:       125
predator_initial:   9
prey_cap:           375
predator_cap:       40
prey_e_initial:     100.0
predator_e_initial: 100.0

# ─── Agent Bodies ────────────────────────────────────────────────────────────
prey_radius:        10.0
predator_radius:    14.0
max_motor_norm:     114.0

# ─── Sensors ─────────────────────────────────────────────────────────────────
n_proximity_sensors:    32
n_proximity_channels:   4
proximity_fov_deg:      120.0
proximity_max_range:    120.0
n_tactile_sensors:      18
n_tactile_channels:     4
tactile_spacing_deg:    20.0

# ─── Physics (paper-faithful) ───────────────────────────────────────────────
n_physics_iter:     5

# ─── Food Dynamics ───────────────────────────────────────────────────────────
food_max:               525
food_initial:           35
food_growth_rate_at_960sq: 0.5
food_max_regen_per_step: 9

# ─── Energy ──────────────────────────────────────────────────────────────────
energy_capacity:        1000.0
prey_e_food:            1.0
prey_c_b:               1.0e-4
prey_c_a:               2.5e-6
predator_d_b:           4.0e-3
predator_d_a:           5.0e-5
predator_eta:           0.50

# ─── Predator Mouth — v10 widening ──────────────────────────────────────────
predator_mouth_tactile_bins: [0, 1, 17]
predator_eat_interval:       10

# ─── Hazard ──────────────────────────────────────────────────────────────────
# Prey: K&D paper-faithful exponential (unchanged).
# Predators: linear mode with small non-zero slope. Calibrated to be 10–100×
# smaller than the exp form across 0..2M-step lifespans.
kappa_h:            0.01
alpha_e:            0.02
beta_h:             0.2
alpha_t_prey:       4.0e-7
alpha_t_pred:       2.0e-7
beta_t_prey:        4.0e-6
beta_t_pred:        8.0e-13       # small linear slope (was 0.0 in constant_age_predlr)
age_hazard_mode_prey: "exp"
age_hazard_mode_pred: "linear"

# ─── Birth ───────────────────────────────────────────────────────────────────
kappa_b:            1.0e-3
beta_b:             0.4
zeta_b_prey:        15.0
zeta_b_pred:        100.0

# ─── Offspring ───────────────────────────────────────────────────────────────
energy_share_ratio: 0.4
spawn_spread:       100.0

# ─── Reward Genome (linear only) ─────────────────────────────────────────────
reward_weights_init_std:  0.1
mutation_df:              2
mutation_scale:           0.4
weight_clip:              100.0

# ─── Policy ──────────────────────────────────────────────────────────────────
policy_hidden_size:   64
policy_n_hidden_layers: 2

# ─── PPO ─────────────────────────────────────────────────────────────────────
gamma:              0.999
rollout_steps:      256           # was 1024 — 4× more frequent PPO triggers
minibatch_size:     256
ppo_epochs:         10
clip_epsilon:       0.2
entropy_coef:       0.001
gae_lambda:         0.95
lr:                 3.0e-4
adam_eps:           1.0e-7
vf_clip:            true
vf_coef:            0.5

# ─── Per-agent age-keyed LR schedule (v10) ──────────────────────────────────
lr_schedule_enable:       true
lr_schedule_initial:      1.0e-3
lr_schedule_final:        3.0e-4
lr_schedule_decay_steps:  30000

# ─── Per-species LR multiplier ──────────────────────────────────────────────
# Stacks multiplicatively on top of the age schedule.
lr_prey_multiplier:       1.0
lr_pred_multiplier:       3.0     # was 10× — conservative dial-back

# ─── Death-age ring buffer (v10) ────────────────────────────────────────────
death_age_ring_size:      256

# ─── Action Space ────────────────────────────────────────────────────────────
action_clip_low:    -20.0
action_clip_high:   80.0
action_mapping:     "sigmoid"

# ─── Replay recording ────────────────────────────────────────────────────────
replay_record_interval_steps:
  - {after: 0,         interval: 20_000}
  - {after: 200_000,   interval: 50_000}
  - {after: 1_000_000, interval: 100_000}
replay_record_length_steps:   10_000
replay_quantize: true
replay_bucket: "evo-reward-replays-public"
replay_retention_policy: "milestones"
replay_retention_config:
  keep_last_n: 100
  keep_at_steps:
    [0, 20_000, 40_000, 60_000, 80_000, 100_000, 150_000, 200_000,
     300_000, 500_000, 800_000, 1_000_000, 2_000_000, 5_000_000, 10_000_000]
  tolerance: 5_000

# ─── Reproducibility ─────────────────────────────────────────────────────────
seed:               0
