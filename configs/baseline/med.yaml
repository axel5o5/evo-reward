# K&D Baseline Control — tier med (L3, production)
# ===================================================================
# Matched scientific control for axis1/med.yaml, axis2/med.yaml,
# axis12/med.yaml. Same scaffolds, same scale, same population caps —
# only diff vs axis1/med.yaml is `reward_type: linear` (no residual MLP).
# Only diff vs axis2/med.yaml is K&D-faithful proximity encoding.
#
# This is the production control tier you'd cite alongside axis1/2/12 med
# results in a paper. Replace `axis1/med` minus `baseline/med` for the
# pure axis-1 effect, and likewise for axis 2 and the combined run.

# ─── Identity ────────────────────────────────────────────────────────────────
experiment_name:    "baseline_kd_linear_med"
policy_mode:        "independent"
lifecycle_mode:     "continuous"
reward_type:        "linear"
policy_type:        "mlp"
coevolution_mode:   "concurrent"

# ─── Stability mechanism (matches axis1/med §15.22 retune) ──────────────────
stability_mechanism:                       "ddb_ddm"
density_breeding_threshold_pred:           13.0    # §15.22→§15.27→§15.28b retune (axis1 alignment)
density_breeding_threshold_prey:           130.0   # §15.22→§15.27→§15.28b retune (axis1 alignment)
density_metabolism_threshold_pred:         13.0    # §15.22→§15.27→§15.28b retune (axis1 alignment)
density_metabolism_threshold_prey:         130.0   # §15.22→§15.27→§15.28b retune (axis1 alignment)
density_factor_floor:                      0.0
breeding_share_alpha:                      0.75    # §15.27 unified at 0.75 (axis1 alignment)

# ─── Observation ─────────────────────────────────────────────────────────────
obs_dim:            205

# ─── World (med-large scale) ─────────────────────────────────────────────────
world_size:         880
total_steps:        10_240_000

# ─── Population (med-large scale) ────────────────────────────────────────────
prey_initial:       125
predator_initial:   20        # §15.26 cold-start parity (axis1 alignment)
prey_cap:           375        # §15.27 paper-density (axis1 alignment)
predator_cap:       40
prey_e_initial:     100.0
predator_e_initial: 150.0    # §15.26 cold-start parity (axis1 alignment)
emergency_breeding_n_pred: 3   # §15.26 (axis1 alignment)
emergency_breeding_n_prey: 10  # §15.26 (axis1 alignment)

# ─── Agent Bodies ────────────────────────────────────────────────────────────
prey_radius:        10.0
predator_radius:    14.0
max_motor_norm:     114.0

# ─── Sensors ─────────────────────────────────────────────────────────────────
n_proximity_sensors:    32
n_proximity_channels:   4
proximity_fov_deg:      120.0
proximity_max_range:    120.0
n_tactile_sensors:      18
n_tactile_channels:     4
tactile_spacing_deg:    20.0

# ─── Physics (paper-faithful) ───────────────────────────────────────────────
n_physics_iter:     5

# ─── Food Dynamics ───────────────────────────────────────────────────────────
food_max:               505        # §15.27 paper-density (axis1 alignment)
food_radius:           4.0    # §15.30 paper-faithful (was implicit 0)
food_initial:           34
food_growth_rate_at_960sq: 0.5
food_max_regen_per_step: 8         # §15.27 paper density-isometric (axis1 alignment)

# ─── Energy ──────────────────────────────────────────────────────────────────
energy_capacity:        1000.0
prey_e_food:            1.0
prey_c_b:               1.0e-4
prey_c_a:               2.5e-6
predator_d_b:           4.5e-3       # §15.31: 4e-3 → 4.5e-3 (+12.5% passive — anti-lazy)
predator_d_a:           4.0e-5       # §15.31: 5e-5 → 4e-5 (-20% active — anti-lazy)
predator_eta:           0.50

# ─── Predator Mouth — v10 widening ──────────────────────────────────────────
prey_mouth_tactile_bins:     [0, 17]    # §15.30 paper-faithful
predator_mouth_tactile_bins: [0, 1, 17]
predator_eat_interval:       10

# ─── Hazard ──────────────────────────────────────────────────────────────────
kappa_h:            0.01
alpha_e:            0.02
beta_h:             0.2
alpha_t_prey:       4.0e-7
alpha_t_pred:       2.0e-7
beta_t_prey:        4.0e-6
beta_t_pred:        4.0e-6

# ─── Birth ───────────────────────────────────────────────────────────────────
kappa_b:            1.0e-3
beta_b:             0.4
zeta_b_prey:        15.0
zeta_b_pred:        100.0

# ─── Offspring ───────────────────────────────────────────────────────────────
energy_share_ratio: 0.4
spawn_spread:       100.0
birth_energy_bonus_global_prey:    1.0    # §15.28 (axis1 alignment)
birth_energy_bonus_global_pred:    5.0    # §15.28 (axis1 alignment)
birth_energy_bonus_emergency_prey: 5.0    # §15.28 (axis1 alignment)
birth_energy_bonus_emergency_pred: 50.0   # §15.28 (axis1 alignment)

# ─── Reward Genome (linear only) ─────────────────────────────────────────────
reward_weights_init_std:  0.1
mutation_df:              2
mutation_scale:           0.4
weight_clip:              100.0

# ─── Policy ──────────────────────────────────────────────────────────────────
policy_hidden_size:   64
policy_n_hidden_layers: 2

# ─── PPO ─────────────────────────────────────────────────────────────────────
gamma:              0.999
rollout_steps:      1024
minibatch_size:     256
ppo_epochs:         10
clip_epsilon:       0.2
entropy_coef:       0.001
gae_lambda:         0.95
lr:                 3.0e-4
adam_eps:           1.0e-7
vf_clip:            true
vf_coef:            0.5

# ─── Per-agent age-keyed LR schedule (v10) ──────────────────────────────────
lr_schedule_enable:       true
lr_schedule_initial:      1.0e-3
lr_schedule_final:        3.0e-4
lr_schedule_decay_steps:  30000

# ─── Death-age ring buffer (v10) ────────────────────────────────────────────
death_age_ring_size:      256

# ─── Action Space ────────────────────────────────────────────────────────────
action_clip_low:    -20.0
action_clip_high:   80.0
action_mapping:     "sigmoid"

# ─── Replay recording ────────────────────────────────────────────────────────
replay_record_interval_steps:
  - {after: 0,         interval: 20_000}
  - {after: 200_000,   interval: 50_000}
  - {after: 1_000_000, interval: 100_000}
replay_record_length_steps:   10_000
replay_quantize: true
replay_bucket: "evo-reward-replays-public"
replay_retention_policy: "milestones"
replay_retention_config:
  keep_last_n: 100
  keep_at_steps:
    [0, 20_000, 40_000, 60_000, 80_000, 100_000, 150_000, 200_000,
     300_000, 500_000, 800_000, 1_000_000, 2_000_000, 5_000_000, 10_000_000]
  tolerance: 5_000

# ─── Reproducibility ─────────────────────────────────────────────────────────
seed:               0
