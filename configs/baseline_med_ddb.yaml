# Baseline (middle-ground + DDB) — second-attempt baseline for axis runs
# =======================================================================
# Replaces baseline_smol_ddb.yaml (which failed: predators extincted at ~80K
# from trophic over-pressure at 600^2 world density).
#
# This config is the middle ground between K&D-faithful 960^2 geometry and
# the over-aggressive small-scale 600^2:
#
#   world_size 800 (70% of original area, 1.4x density vs 2.5x in failed run)
#   prey_cap 300, predator_cap 30  (cap ratio 10:1, slightly prey-favored
#                                   vs original 9:1)
#   predator threshold for DDB bumped 5 -> 8 (rescue fires earlier in the
#                                             decline before energy crashes)
#
# Why the failed run extincted (lessons):
#   At 600^2 with caps 200/25, predator-prey density was ~2.5x the K&D
#   baseline. Catches/step were ~5x normal. Prey crashed 200 -> 74 in 30K
#   steps before predators could establish a sustainable cycle. Predator
#   energy then dropped below the breeding-energy threshold and DDB
#   couldn't help (it lowers the gate but can't put energy in the bank).
#
# What changed for this attempt:
#   1. Less aggressive scale-down: 800^2 vs 600^2 -> density 1.4x (vs 2.5x)
#   2. Slightly prey-favored cap ratio: 10:1 vs original 9:1, vs failed 8:1
#   3. DDB pred threshold 8 (was 5) so rescue fires when pred=8 instead
#      of pred=4. Earlier intervention while predators still have energy.
#
# If this run also extincts predators early, we'll either:
#   - Add DDM (density-dependent metabolism) to address starvation directly
#   - Or fall back to the original 960^2 geometry, accepting slower wall-clock
#
# See findings.md §15 + docs/scope-reset-2026-04-29.md.

# ─── Identity ────────────────────────────────────────────────────────────────
experiment_name:    "baseline_med_ddb"
policy_mode:        "independent"
lifecycle_mode:     "continuous"
reward_type:        "linear"
policy_type:        "mlp"
coevolution_mode:   "concurrent"

# ─── Stability mechanism ─────────────────────────────────────────────────────
stability_mechanism:    "ddb"
ddb_pred_threshold:     8.0       # bumped from 5 -> rescue fires earlier in decline
ddb_prey_threshold:     30.0      # unchanged from baseline_smol_ddb
ddb_floor:              0.3

# ─── Observation ─────────────────────────────────────────────────────────────
obs_dim:            205

# ─── World (middle-scale) ────────────────────────────────────────────────────
world_size:         800           # was 960 / 600 in failed
total_steps:        10_240_000

# ─── Population (middle-scale) ───────────────────────────────────────────────
prey_initial:       100           # was 150 / 75 in failed
predator_initial:   7             # was 10 / 5 in failed
prey_cap:           300           # was 450 / 200 in failed
predator_cap:       30            # was 50 / 25 in failed (extra prey-favored)
prey_e_initial:     100.0
predator_e_initial: 100.0

# ─── Agent Bodies ─────────────────────────────────────────────────────────────
prey_radius:        10.0
predator_radius:    14.0
max_motor_norm:     114.0

# ─── Sensors ─────────────────────────────────────────────────────────────────
n_proximity_sensors:    32
n_proximity_channels:   4
proximity_fov_deg:      120.0
proximity_max_range:    200.0
n_tactile_sensors:      18
n_tactile_channels:     4
tactile_spacing_deg:    20.0

# ─── Food Dynamics (middle-scale) ────────────────────────────────────────────
food_max:               450       # was 600 / 300 in failed
food_initial:           30        # was 40 / 20 in failed
food_growth_rate:       0.5
food_max_regen_per_step: 8        # was 10 / 5 in failed

# ─── Energy — Prey ───────────────────────────────────────────────────────────
energy_capacity:        1000.0
prey_e_food:            1.0
prey_c_b:               1.0e-4
prey_c_a:               2.5e-6

# ─── Energy — Predator ───────────────────────────────────────────────────────
predator_d_b:           4.0e-3
predator_d_a:           5.0e-5
predator_eta:           0.50

# ─── Predator Mouth ──────────────────────────────────────────────────────────
predator_mouth_tactile_bins: [0]   # mouth_smol substrate
predator_eat_interval:       10

# ─── Hazard Function h(t, e) ─────────────────────────────────────────────────
kappa_h:            0.01
alpha_e:            0.02
beta_h:             0.2
alpha_t_prey:       4.0e-7
alpha_t_pred:       2.0e-7
beta_t_prey:        4.0e-6
beta_t_pred:        4.0e-6

# ─── Birth Function b(e) ─────────────────────────────────────────────────────
kappa_b:            1.0e-3
beta_b:             0.4
zeta_b_prey:        15.0
zeta_b_pred:        100.0

# ─── Offspring ───────────────────────────────────────────────────────────────
energy_share_ratio: 0.4
spawn_spread:       100.0

# ─── Reward Genome ───────────────────────────────────────────────────────────
reward_weights_init_std:  0.1
mutation_df:              2
mutation_scale:           0.4
weight_clip:              100.0

# ─── Policy Network ──────────────────────────────────────────────────────────
policy_hidden_size:   64
policy_n_hidden_layers: 2

# ─── PPO Hyperparameters ─────────────────────────────────────────────────────
gamma:              0.999
rollout_steps:      1024
minibatch_size:     256
ppo_epochs:         10
clip_epsilon:       0.2
entropy_coef:       0.001
gae_lambda:         0.95
lr:                 3.0e-4
adam_eps:           1.0e-7
vf_clip:            true
vf_coef:            0.5

# ─── Action Space ────────────────────────────────────────────────────────────
action_clip_low:    -20.0
action_clip_high:   80.0
action_mapping:     "sigmoid"

# ─── Replay recording ────────────────────────────────────────────────────────
replay_record_interval_steps: 20_000
replay_record_length_steps:   10_000
replay_quantize: true
replay_bucket: "evo-reward-replays-public"
replay_retention_policy: "milestones"
replay_retention_config:
  keep_last_n: 100
  keep_at_steps:
    [0, 20_000, 40_000, 60_000, 80_000, 100_000, 150_000, 200_000,
     300_000, 500_000, 800_000, 1_000_000, 2_000_000, 5_000_000, 10_000_000]
  tolerance: 5_000

# ─── Reproducibility ─────────────────────────────────────────────────────────
seed:               0
