# Axis 1 — Residual MLP reward (v10) — full (paper-faithful scale)
# ===================================================================
# Tier full: paper-faithful 960² world, caps 450/50, paper population.
# All v10 mechanism additions enabled (mouth widening, age-keyed LR,
# death-age ring). §15.22 retune T values bumped for the larger pop.
#
# Use this for paper-comparable runs. Long wall-clock (~36-48h on L4 GPU).

# ─── Identity ────────────────────────────────────────────────────────────────
experiment_name:    "axis1_residual_reward_mlp_full"
policy_mode:        "independent"
lifecycle_mode:     "continuous"
reward_type:        "linear_plus_mlp_residual"
policy_type:        "mlp"
coevolution_mode:   "concurrent"

# ─── Stability mechanism (§15.22 + §15.27 retune; tier full) ────────────────
# §15.27: T values pulled back partway, alpha bumped to 0.75 (selection knob).
# See findings.md §15.27 for the lazy-clusterer diagnosis driving this retune.
stability_mechanism:                       "ddb_ddm"
density_breeding_threshold_pred:           15.0    # 22 → 17 (§15.27) → 15 (§15.28b)
density_breeding_threshold_prey:           150.0   # 220 → 170 (§15.27) → 150 (§15.28b)
density_metabolism_threshold_pred:         15.0    # 22 → 17 (§15.27) → 15 (§15.28b)
density_metabolism_threshold_prey:         150.0   # 220 → 170 (§15.27) → 150 (§15.28b)
density_factor_floor:                      0.0
breeding_share_alpha:                      0.75    # 0.5 → 0.75 in §15.27 — unified
                                                   # across tiers; sharpens energy-
                                                   # weighted breeding share.

# ─── Observation ─────────────────────────────────────────────────────────────
obs_dim:            205

# ─── World (paper) ──────────────────────────────────────────────────────────
world_size:         960
total_steps:        10_240_000

# ─── Population (paper) ─────────────────────────────────────────────────────
prey_initial:       150
predator_initial:   30        # bumped 11→30 (cold-start cohort survives bad luck)
prey_cap:           450
predator_cap:       50
prey_e_initial:     100.0
predator_e_initial: 150.0     # bumped 100→150 (more PPO time before E<0)
emergency_breeding_n_pred: 3  # below this, breeding overrides energy gate
emergency_breeding_n_prey: 10

# ─── Agent Bodies ────────────────────────────────────────────────────────────
prey_radius:        10.0
predator_radius:    14.0
max_motor_norm:     114.0

# ─── Sensors ─────────────────────────────────────────────────────────────────
n_proximity_sensors:    32
n_proximity_channels:   4
proximity_fov_deg:      120.0
proximity_max_range:    120.0
n_tactile_sensors:      18
n_tactile_channels:     4
tactile_spacing_deg:    20.0

# ─── Physics (paper-faithful) ────────────────────────────────────────────────
n_physics_iter:     5

# ─── Food Dynamics ───────────────────────────────────────────────────────────
food_max:               600
food_radius:           4.0    # §15.30 paper-faithful (was implicit 0)
food_initial:           40
food_growth_rate_at_960sq: 0.5            # exact paper rate at world=960
food_max_regen_per_step: 10

# ─── Energy ──────────────────────────────────────────────────────────────────
energy_capacity:        1000.0
prey_e_food:            1.0
prey_c_b:               1.0e-4
prey_c_a:               2.5e-6
predator_d_b:           4.5e-3       # §15.31: 4e-3 → 4.5e-3 (+12.5% passive — anti-lazy)
predator_d_a:           4.0e-5       # §15.31: 5e-5 → 4e-5 (-20% active — anti-lazy)
predator_eta:           0.50

# ─── Predator Mouth — v10 widening ──────────────────────────────────────────
prey_mouth_tactile_bins:     [0, 17]    # §15.30 paper-faithful
predator_mouth_tactile_bins: [0, 1, 17]
predator_eat_interval:       10

# ─── Hazard ──────────────────────────────────────────────────────────────────
kappa_h:            0.01
alpha_e:            0.02
beta_h:             0.2
alpha_t_prey:       4.0e-7
alpha_t_pred:       2.0e-7
beta_t_prey:        4.0e-6
beta_t_pred:        4.0e-6

# ─── Birth ───────────────────────────────────────────────────────────────────
kappa_b:            1.0e-3
beta_b:             0.4
zeta_b_prey:        15.0
zeta_b_pred:        100.0

# ─── Offspring ───────────────────────────────────────────────────────────────
energy_share_ratio: 0.4
spawn_spread:       100.0

# §15.28 — scaffold-aware additive birth-energy bonus. Both child AND parent
# get +bonus at birth, where bonus = bonus_global + bonus_emergency * (1 - factor).
# Rescues death-spiral regime where parent E is too low to give a viable child
# via the bare K&D 0.4 transfer (axis1/small extincted at step ~80K because
# newborns inherited starvation). Defaults 0.0 → paper-faithful K&D.
birth_energy_bonus_global_prey:    1.0    # always added at prey birth
birth_energy_bonus_global_pred:    5.0    # always added at predator birth
birth_energy_bonus_emergency_prey: 5.0    # added linearly as prey scaffold engages
birth_energy_bonus_emergency_pred: 50.0   # added linearly as predator scaffold engages

# ─── Reward Genome (linear + residual MLP) ──────────────────────────────────
reward_weights_init_std:  0.1
mutation_df:              2
mutation_scale:           0.4
weight_clip:              100.0
residual_hidden_size:     4
residual_mutation_scale:  0.03
residual_weight_clip:     5.0

# ─── Policy ──────────────────────────────────────────────────────────────────
policy_hidden_size:   64
policy_n_hidden_layers: 2

# ─── PPO ─────────────────────────────────────────────────────────────────────
gamma:              0.999
rollout_steps:      1024
minibatch_size:     256
ppo_epochs:         10
clip_epsilon:       0.2
entropy_coef:       0.001
gae_lambda:         0.95
lr:                 3.0e-4
adam_eps:           1.0e-7
vf_clip:            true
vf_coef:            0.5

# ─── Per-agent age-keyed LR schedule (v10) ──────────────────────────────────
lr_schedule_enable:       true
lr_schedule_initial:      1.0e-3
lr_schedule_final:        3.0e-4
lr_schedule_decay_steps:  30000

# ─── Death-age ring buffer (v10) ────────────────────────────────────────────
death_age_ring_size:      256

# ─── Action Space ────────────────────────────────────────────────────────────
action_clip_low:    -20.0
action_clip_high:   80.0
action_mapping:     "sigmoid"

# ─── Replay recording ────────────────────────────────────────────────────────
replay_record_interval_steps:
  - {after: 0,         interval: 20_000}
  - {after: 200_000,   interval: 50_000}
  - {after: 1_000_000, interval: 100_000}
replay_record_length_steps:   10_000
replay_quantize: true
replay_bucket: "evo-reward-replays-public"
replay_retention_policy: "milestones"
replay_retention_config:
  keep_last_n: 100
  keep_at_steps:
    [0, 20_000, 40_000, 60_000, 80_000, 100_000, 150_000, 200_000,
     300_000, 500_000, 800_000, 1_000_000, 2_000_000, 5_000_000, 10_000_000]
  tolerance: 5_000

# ─── Reproducibility ─────────────────────────────────────────────────────────
seed:               0
