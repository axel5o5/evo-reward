# Axis 1 v10-L1 (a.k.a. v10-mini): the most aggressive iteration tier.
# ====================================================================
# Branched from L2 (axis1_residual_fast.yaml). L1 trades scale-faithfulness
# for the maximum plausible speedup so that v10 *mechanism* hypotheses
# (mouth + age-LR + death-age) can be probed at the lowest wall-clock cost.
#
# This is the experimental "for the heck of it" tier. Quantitative results
# from L1 may not predict L3 behavior — the policy is capacity-restricted,
# the population is below the paper's natural-selection floor, and the
# physics solver runs fewer iterations. Use L1 as a yes/no check that the
# v10 mechanisms can produce *any* signal; promote to L2 or L3 to validate
# magnitude.
#
# Diff vs L2 (axis1_residual_fast.yaml):
#   - world_size:        750    → 600    (~36% additional area reduction)
#   - prey_cap:          300    → 200
#   - predator_cap:      35     → 20
#   - prey_initial:      90     → 60     (density-isometric)
#   - predator_initial:  7      → 4
#   - policy_hidden_size 48     → 32     (accepts the deeper SVD compromise)
#   - n_physics_iter:    4      → 3      (one further substep cut)
#   - DDB/DDM thresholds (§15.22 retune; tier-graduated):
#       T_pred 10 → 12, T_prey 100 → 120, T_ddm_pred 10 → 12, +T_ddm_prey 120
#       (smaller than L3's 20/200 because L1's caps are smaller — engagement
#       point scales with tier, but stays HIGHER than naive proportional
#       scaling because LV-crash cost is higher at small pop)
#   - ddb_max_boost REMOVED (§15.22)
#   - ddb_boost_distribution_alpha: 0.5 → 0.3  (more uniform; tiny-pop variance)
#   - everything v10 (mouth, age-LR, death-age) preserved
#
# Expected speedup vs L3 (CPU): ~2-2.5× (physics N² halved twice + PPO 4×
# from L2's epoch/minibatch cuts plus 2× from hidden cut). On GPU may be
# closer to ~1.5-2× — most of the speedup comes from compute reductions
# that GPU was already underutilized on.
#
# Stability concerns at this scale:
#   - 220 agents total is below paper's 550 agent floor. Selection signal
#     is noisier; LV cycles could amplify into actual extinction even
#     with DDB+DDM scaffolds.
#   - DDB thresholds need to scale down: pred T=10 was tuned for ~30 active
#     predators; at pred_cap=20 it's still effectively "always active." We
#     leave thresholds unchanged here so behavior stays predictable when
#     comparing to L2/L3 — DDB+DDM will simply fire more aggressively at
#     this density, which is the conservative choice.

# ─── Identity ────────────────────────────────────────────────────────────────
experiment_name:    "axis1_residual_reward_mlp_tiny"   # v10 tier: tiny
policy_mode:        "independent"
lifecycle_mode:     "continuous"
reward_type:        "linear_plus_mlp_residual"
policy_type:        "mlp"
coevolution_mode:   "concurrent"

# ─── Stability mechanism ─────────────────────────────────────────────────────
# §15.22 retune + §15.23 rename. Tier-graduated T values for L1.
stability_mechanism:                       "ddb_ddm"
density_breeding_threshold_pred:           12.0    # bumped from 8 in §15.22
density_breeding_threshold_prey:           120.0   # bumped from 60 in §15.22
density_metabolism_threshold_pred:         12.0    # mirrors breeding pred
density_metabolism_threshold_prey:         120.0   # NEW in §15.22 — symmetric
density_factor_floor:                      0.0
breeding_share_alpha:                      0.3     # more uniform share at tiny pop
                                                   # (was 0.5; lowered for L1)

# ─── Observation ─────────────────────────────────────────────────────────────
obs_dim:            205

# ─── World — L1 cut to 600² ──────────────────────────────────────────────────
world_size:         600
total_steps:        10_240_000

# ─── Population — L1 cuts (paper-faithful density at 600²) ──────────────────
# Density: 200 / 600² = 5.56/10⁴ (vs paper 4.88/10⁴ at 960²) — slightly hot
# but in the same regime.
prey_initial:       60
predator_initial:   4
prey_cap:           200
predator_cap:       20
prey_e_initial:     100.0
predator_e_initial: 100.0

# ─── Agent Bodies ────────────────────────────────────────────────────────────
prey_radius:        10.0
predator_radius:    14.0
max_motor_norm:     114.0

# ─── Sensors ─────────────────────────────────────────────────────────────────
n_proximity_sensors:    32
n_proximity_channels:   4
proximity_fov_deg:      120.0
proximity_max_range:    120.0
n_tactile_sensors:      18
n_tactile_channels:     4
tactile_spacing_deg:    20.0

# ─── Physics — L1 cut to 3 iterations (was 5; ~30% physics speedup) ─────────
# Default in src/environment.py is 5 (paper-faithful). Reducing to 3 makes
# the velocity solver less precise — tunneling-through-wall becomes more
# common, which can manifest as agents briefly overlapping past their
# radii. Acceptable for L1's iteration-speed goal; never use for paper
# comparison runs.
n_physics_iter:     3

# ─── Food Dynamics ───────────────────────────────────────────────────────────
food_max:               250
food_initial:           18
# At world=600 → effective rate 0.5 × (600/960)² ≈ 0.195 food/step.
food_growth_rate_at_960sq: 0.5
food_max_regen_per_step: 5

# ─── Energy ──────────────────────────────────────────────────────────────────
energy_capacity:        1000.0
prey_e_food:            1.0
prey_c_b:               1.0e-4
prey_c_a:               2.5e-6
predator_d_b:           4.0e-3
predator_d_a:           5.0e-5
predator_eta:           0.50

# ─── Predator Mouth — v10 widening (kept; ~free) ────────────────────────────
predator_mouth_tactile_bins: [0, 1, 17]
predator_eat_interval:       10

# ─── Hazard ──────────────────────────────────────────────────────────────────
kappa_h:            0.01
alpha_e:            0.02
beta_h:             0.2
alpha_t_prey:       4.0e-7
alpha_t_pred:       2.0e-7
beta_t_prey:        4.0e-6
beta_t_pred:        4.0e-6

# ─── Birth ───────────────────────────────────────────────────────────────────
kappa_b:            1.0e-3
beta_b:             0.4
zeta_b_prey:        15.0
zeta_b_pred:        100.0

# ─── Offspring ───────────────────────────────────────────────────────────────
energy_share_ratio: 0.4
spawn_spread:       100.0

# ─── Reward Genome (linear part) ─────────────────────────────────────────────
reward_weights_init_std:  0.1
mutation_df:              2
mutation_scale:           0.4
weight_clip:              100.0

# ─── Reward Genome (residual MLP part) ───────────────────────────────────────
residual_hidden_size:     4
residual_mutation_scale:  0.03
residual_weight_clip:     5.0

# ─── Policy — L1 cut to hidden=32 (knowingly throws away ~22% capacity) ─────
policy_hidden_size:   32
policy_n_hidden_layers: 2

# ─── PPO — match L2 (rollout=1024, mb=256, epochs=5) ────────────────────────
gamma:              0.999
rollout_steps:      1024
minibatch_size:     256
ppo_epochs:         5
clip_epsilon:       0.2
entropy_coef:       0.001
gae_lambda:         0.95
lr:                 3.0e-4
adam_eps:           1.0e-7
vf_clip:            true
vf_coef:            0.5

# ─── Per-agent age-keyed LR schedule (v10) ──────────────────────────────────
lr_schedule_enable:       true
lr_schedule_initial:      1.0e-3
lr_schedule_final:        3.0e-4
lr_schedule_decay_steps:  30000

# ─── Death-age ring buffer (v10) ────────────────────────────────────────────
death_age_ring_size:      256

# ─── Action Space ────────────────────────────────────────────────────────────
action_clip_low:    -20.0
action_clip_high:   80.0
action_mapping:     "sigmoid"

# ─── Replay recording ────────────────────────────────────────────────────────
replay_record_interval_steps:
  - {after: 0,         interval: 20_000}
  - {after: 200_000,   interval: 50_000}
  - {after: 1_000_000, interval: 100_000}
replay_record_length_steps:   10_000
replay_quantize: true
replay_bucket: "evo-reward-replays-public"
replay_retention_policy: "milestones"
replay_retention_config:
  keep_last_n: 100
  keep_at_steps:
    [0, 20_000, 40_000, 60_000, 80_000, 100_000, 150_000, 200_000,
     300_000, 500_000, 800_000, 1_000_000, 2_000_000, 5_000_000, 10_000_000]
  tolerance: 5_000

# ─── Reproducibility ─────────────────────────────────────────────────────────
seed:               0
