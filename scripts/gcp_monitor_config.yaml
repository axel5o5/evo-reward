# GCP monitor — multi-target config.
#
# Each `targets` entry is one (project, VM, bucket) triple. The monitor
# probes them sequentially every cron tick and emits a payload like
#   { updated_at, targets: [ {label, project_id, vm, checkpoints, costs,
#                             training, errors, allow_actions}, ... ] }
# which the dashboard renders as one card per target.
#
# allow_actions: only targets where this is true get the PIN-protected
# Stop/Start/Restart/Delete control panel. The action workflow
# (.github/workflows/gcp-action.yml) is wired only to the Axel/evo-reward
# project, so other targets must stay read-only.
#
# Auth: a single service account (gcp-dashboard@evo-reward.iam) is used
# for all probes. It needs roles/compute.viewer + roles/storage.objectViewer
# on every project/bucket below.
#
# Adding a target: copy a block, change project_id / vm_name /
# candidate_zones / gcs.bucket. Grant the SA the two viewer roles on the
# new project + bucket.

targets:
  - label: Axel
    project_id: evo-reward
    vm_name: evo-reward-gpu
    allow_actions: true
    # Zones to check for the VM. Mirrors ZONES_TO_TRY in
    # scripts/spot_orchestrator.py. If you edit one, edit both.
    candidate_zones:
      - us-central1-a
      - us-central1-b
      - us-central1-c
      - us-east4-b
      - us-east4-c
      - us-west1-a
      - us-west1-b
      - us-east1-b
      - us-east1-c
    gcs:
      bucket: evo-reward-ckpts
      # Price per GB-month for standard-class storage in us-central1, Apr 2026.
      storage_usd_per_gb_month: 0.020
    pricing:
      g2-standard-8:
        ondemand: 0.85
        spot:     0.28
      n1-standard-4:
        ondemand: 0.19
        spot:     0.04
    infra_costs:
      nat_hourly_usd: 0.044                # us-central1 Cloud NAT gateway
      disk_hourly_usd_when_stopped: 0.020  # 200 GB PD-balanced standard rate
      # First NAT (us-central1) was created 2026-04-18 by docs/gcp-setup.md
      # step 6. Underestimates 2026-04-18 → 2026-04-20 when 2-3 NATs
      # overlapped while the orchestrator rotated regions.
      nat_active_since: "2026-04-18T15:15:13-07:00"
    billing:
      export_table: null
      account_id:   null

  - label: Gil
    project_id: rl-bio-sims-494715
    # launch_sweep_vm.sh names the VM via $1 — keep this in sync with the
    # name passed at launch time (or set to the actual running VM's name).
    vm_name: evo-reward-gpu
    # Read-only on the dashboard: api/action.ts + gcp-action.yml only
    # know about the evo-reward project, so PIN actions can't target this.
    allow_actions: false
    candidate_zones:
      - us-central1-a
      - us-central1-b
      - us-central1-c
      - us-east1-b
      - us-east1-c
      - us-east4-b
      - us-east4-c
      - us-west1-a
      - us-west1-b
    gcs:
      bucket: rl-bio-sims-494715-ckpts
      storage_usd_per_gb_month: 0.020
    pricing:
      g2-standard-8:
        ondemand: 0.85
        spot:     0.28
      g2-standard-4:
        ondemand: 0.71
        spot:     0.21
    infra_costs:
      nat_hourly_usd: 0.044
      disk_hourly_usd_when_stopped: 0.020
      nat_active_since: null  # set when first router+NAT created in this project
    billing:
      export_table: null
      account_id:   null

# UI hints (frontend reads from the top level, not per-target).
staleness_threshold_minutes: 20
